spring:
  application:
    name: fileuploader-attacker

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password123
  bucket: images


server:
  port: 33000

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics,env,loggers
  metrics:
    tags:
      application: test-api
  endpoint:
    health:
      show-details: always